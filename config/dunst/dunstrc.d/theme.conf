# Style and colors generated for the h4ck3r theme.

[global]
origin = top-center
offset = (0, 60)

transparency = 0
corner_radius = 0

frame_width = 2
frame_color = "#76EA00"

font = JetBrainsMono NF Medium 9
icon_theme = "BeautyLine, Adwaita""

format = "<span size='xx-large' font_desc='Cantarell 9' weight='bold' foreground='#578a29'>%s</span>\n%b"

[urgency_low]
timeout = 3
background = "#0c1018"
foreground = "#00fa5c"

[urgency_normal]
timeout = 5
background = "#0c1018"
foreground = "#1947e0"

[urgency_critical]
timeout = 0
background = "#0c1018"
foreground = "#6DDE00"
